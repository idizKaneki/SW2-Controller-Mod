; SW2Controller.asi - Samurai Warriors 2 (PC) - Controller mod
; 1 = on, 0 = off
[Controller]
; Lets the game read all the axes of the controller (needed for the right stick camera)
RightStick=1
; Menus: A / Cross confirms, B / Circle cancels, like western console versions
MenuConfirmA=1
; Button settings screen: never ask "Use the gamepad's auto-setting?" (answering Yes erases the layout)
NoAutoSetup=1

[Icons]
; "Rotate map" prompt (pause menu) shows the right stick instead of the keyboard camera keys.
; Needs the controller icons. Set to 0 if you went back to the keyboard icons.
RotateRightStick=1
